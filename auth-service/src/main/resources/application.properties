spring.application.name=auth-service
server.port=8086

spring.datasource.url=jdbc:h2:mem:authdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=auth
spring.datasource.password=auth

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Actuator
# management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.api-docs.path=/api/auth/v3/api-docs

# Dozvoljava Swagger-u sa porta 8080 da povuce dokumentaciju
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080
management.endpoints.web.cors.allowed-origins=http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE

spring.config.import=optional:configserver:http://localhost:8888
# Objedinjeni Actuator endpointi (za zdravlje, CB i refresh configa)
management.endpoints.web.exposure.include=health,circuitbreakers,refresh
logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]