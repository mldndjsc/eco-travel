spring.application.name=avanture-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8088}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/avanture/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080

logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]

vodici-service.url=${VODICI_SERVICE_URL:http://localhost:8089}
smestaj-service.url=${SMESTAJ_SERVICE_URL:http://localhost:8084}
booking-service.url=${BOOKING_SERVICE_URL:http://localhost:8082}

resilience4j.circuitbreaker.instances.vodici-client.register-health-indicator=true
resilience4j.circuitbreaker.instances.vodici-client.sliding-window-size=10
resilience4j.circuitbreaker.instances.vodici-client.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.vodici-client.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.vodici-client.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.vodici-client.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.vodici-client.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.vodici-client.event-consumer-buffer-size=20

resilience4j.circuitbreaker.instances.smestaj-client.register-health-indicator=true
resilience4j.circuitbreaker.instances.smestaj-client.sliding-window-size=10
resilience4j.circuitbreaker.instances.smestaj-client.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.smestaj-client.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.smestaj-client.failure-rate-threshold=50

resilience4j.circuitbreaker.instances.booking-client.register-health-indicator=true
resilience4j.circuitbreaker.instances.booking-client.sliding-window-size=10
resilience4j.circuitbreaker.instances.booking-client.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.booking-client.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.booking-client.failure-rate-threshold=50

resilience4j.retry.instances.vodici-client.max-attempts=3
resilience4j.retry.instances.vodici-client.wait-duration=500ms
resilience4j.retry.instances.vodici-client.ignore-exceptions=io.github.resilience4j.circuitbreaker.CallNotPermittedException

resilience4j.retry.instances.smestaj-client.max-attempts=3
resilience4j.retry.instances.smestaj-client.wait-duration=500ms

resilience4j.retry.instances.booking-client.max-attempts=3
resilience4j.retry.instances.booking-client.wait-duration=500ms

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,retryevents,metrics,refresh
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
