# Naziv aplikacije i port na kome radi
spring.application.name=finansije-service

# H2 Baza u memoriji (podaci se gube pri ga?enju aplikacije)
#spring.datasource.url=jdbc:h2:mem:finansijedb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=md
#spring.datasource.password=

# JPA / Hibernate pode?avanja
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: Automatski pravi tabele pri pokretanju i bri?e ih pri ga?enju
#spring.jpa.hibernate.ddl-auto=create-drop

# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pode?avanja za inicijalizaciju baze (data.sql fajl)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pristup bazi preko browsera na http://localhost:8083/h2-console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.h2.console.settings.web-allow-others=true

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always

# Konfiguracija instance osiguraca
resilience4j.circuitbreaker.instances.bookingServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.bookingServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.bookingServiceCB.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.bookingServiceCB.permittedNumberOfCallsInHalfOpenState=3

#  Resilience Retry - Booking
resilience4j.retry.instances.bookingServiceCB.max-attempts=3
resilience4j.retry.instances.bookingServiceCB.wait-duration=2s
resilience4j.retry.instances.bookingServiceCB.retry-exceptions=java.io.IOException,feign.FeignException

# Rate Limit
resilience4j.ratelimiter.instances.rezervacijeServiceRateLimit.limit-for-period=10
resilience4j.ratelimiter.instances.rezervacijeServiceRateLimit.limit-refresh-period=1s
resilience4j.ratelimiter.instances.rezervacijeServiceRateLimit.timeout-duration=100ms

# Eksponiranje Actuator endpoint-a
#management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

# Povezivanje Resilience4j sa Health sistemom
resilience4j.circuitbreaker.instances.bookingServiceCB.registerHealthIndicator=true

# Opciono: Smanjenje prenatrpanosti logova za Feign i Resilience4j
logging.level.org.springframework.cloud.openfeign=WARN
logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.file.name=logs/finansije-service.log
# Da se vidi tacno sta Resilience4j radi
logging.level.io.github.resilience4j=DEBUG

springdoc.api-docs.path=/api/finansije/v3/api-docs

# create-drop: Automatski pravi tabele pri pokretanju i bri?e ih pri ga?enju

# Rezervacije service URL
rezervacije.service.url=${REZERVACIJE_SERVICE_URL:http://rezervacije-service:8082}

# Feign
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000


# Dozvoljava Swagger-u sa porta 8080 da povuce dokumentaciju
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080
management.endpoints.web.cors.allowed-origins=http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE

# Objedinjeni Actuator endpointi (za zdravlje, CB i refresh configa)
management.endpoints.web.exposure.include=health,circuitbreakers,refresh
custom.welcome-message=Dobrodosli u Finansije sistem v6!
logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]

# v9

# Adresa RabbitMQ servisa (ime servisa iz docker-compose fajla)
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
# Standardni port za AMQP protokol
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
# Kredencijali (default vrednosti za RabbitMQ sliku)
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Opciono: Omogu?ava automatsko kreiranje definisanih Queue-ova i Exchange-a pri startu
spring.rabbitmq.dynamic=true

