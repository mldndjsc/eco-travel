spring.application.name=maintenance-service

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/maintenance/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080
spring.jpa.hibernate.ddl-auto=update
server.error.include-message=always
server.error.include-binding-errors=always

management.endpoints.web.exposure.include=health,circuitbreakers,refresh
management.endpoint.health.show-details=always

logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]