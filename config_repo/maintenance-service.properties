spring.application.name=maintenance-service

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/maintenance/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080
spring.jpa.hibernate.ddl-auto=update
server.error.include-message=always
server.error.include-binding-errors=always

management.endpoints.web.exposure.include=health,circuitbreakers,refresh
management.endpoint.health.show-details=always

logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]

# --- RESILIENCE4J (Circuit Breaker) ---
# Ime "accommodation-service" MORA biti isto kao u tvom @FeignClient(name = "accommodation-service")
resilience4j.circuitbreaker.instances.accommodation-service.sliding-window-size=5
resilience4j.circuitbreaker.instances.accommodation-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.accommodation-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.accommodation-service.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.accommodation-service.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.accommodation-service.register-health-indicator=true
# Obavezno za prikaz circuit breakera u health-u
management.health.circuitbreakers.enabled=true
# --- RESILIENCE4J (Retry - da pokuša ponovo pre nego što odustane) ---
resilience4j.retry.instances.accommodation-service.max-attempts=3
resilience4j.retry.instances.accommodation-service.wait-duration=500ms
resilience4j.retry.instances.accommodation-service.retry-exceptions=feign.FeignException