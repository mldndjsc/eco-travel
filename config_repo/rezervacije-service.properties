# Naziv aplikacije i port na kome radi
spring.application.name=rezervacije-service


# H2 Baza u memoriji (podaci se gube pri ga?enju aplikacije)
#spring.datasource.url=jdbc:h2:mem:rezervacijedb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=md
#spring.datasource.password=

# JPA / Hibernate pode?avanja
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: Automatski pravi tabele pri pokretanju i bri?e ih pri ga?enju
#spring.jpa.hibernate.ddl-auto=create-drop

# Ispis SQL upita u konzoli (korisno za debagovanje)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pode?avanja za inicijalizaciju baze (data.sql fajl)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pristup bazi preko browsera na http://localhost:8081/h2-console
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console
#spring.h2.console.settings.web-allow-others=true

# Swagger dokumentacija (interfejs za testiranje endpointa)
# Putanja: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html


server.error.include-message=always
server.error.include-stacktrace=never
server.error.include-binding-errors=always



springdoc.api-docs.path=/api/rezervacije/v3/api-docs

# Smestaj service URL
smestaj.service.url=${SMESTAJ_SERVICE_URL:http://smestaj-service:8087}
# Finansije service URL
finansije.service.url=${FINANSIJE_SERVICE_URL:http://finansije-service:8083}
# Resilience4j CircuitBreaker - Smestaj
resilience4j.circuitbreaker.instances.smestajService.sliding-window-size=5
resilience4j.circuitbreaker.instances.smestajService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.smestajService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.smestajService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.smestajService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.smestajService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.smestajService.register-health-indicator=true
resilience4j.ratelimiter.instances.smestajServiceRateLimit.limit-for-period=10
resilience4j.ratelimiter.instances.smestajServiceRateLimit.limit-refresh-period=1s
resilience4j.ratelimiter.instances.smestajServiceRateLimit.timeout-duration=100ms

# Resilience4j CircuitBreaker - Finansije
resilience4j.circuitbreaker.instances.finansijeService.sliding-window-size=5
resilience4j.circuitbreaker.instances.finansijeService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.finansijeService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.finansijeService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.finansijeService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.finansijeService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.finansijeService.register-health-indicator=true
resilience4j.ratelimiter.instances.finansijeServiceRateLimit.limit-for-period=10
resilience4j.ratelimiter.instances.finansijeServiceRateLimit.limit-refresh-period=1s
resilience4j.ratelimiter.instances.finansijeServiceRateLimit.timeout-duration=100ms

# Resilience4j Retry - Smestaj
resilience4j.retry.instances.smestajService.max-attempts=3
resilience4j.retry.instances.smestajService.wait-duration=2s
resilience4j.retry.instances.smestajService.retry-exceptions=java.io.IOException,feign.FeignException

# Resilience4j Retry - Finansije
resilience4j.retry.instances.finansijeService.max-attempts=3
resilience4j.retry.instances.finansijeService.wait-duration=2s
resilience4j.retry.instances.finansijeService.retry-exceptions=java.io.IOException,feign.FeignException

# Feign
feign.client.config.default.connect-timeout=3000
feign.client.config.default.read-timeout=3000
logging.level.org.springframework.cloud.openfeign=WARN

# Dozvoljava Swagger-u sa porta 8080 da povuce dokumentaciju
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080
management.endpoints.web.cors.allowed-origins=http://localhost:8080
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE


# Objedinjeni Actuator endpointi (za zdravlje, CB i refresh configa)
management.endpoints.web.exposure.include=health,circuitbreakers,refresh
logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]

# v9

# Adresa RabbitMQ servisa (ime servisa iz docker-compose fajla)
spring.rabbitmq.host=rabbitmq
# Standardni port za AMQP protokol
spring.rabbitmq.port=5672
# Kredencijali (default vrednosti za RabbitMQ sliku)
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Opciono: Omogu?ava automatsko kreiranje definisanih Queue-ova i Exchange-a pri startu
spring.rabbitmq.dynamic=true