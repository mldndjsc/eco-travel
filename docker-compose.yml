version: '3.8'

services:
  # 1. CONFIG SERVIS - Centralna konfiguracija
  config-service:
    build:
      context: .
      dockerfile: config-service/Dockerfile
    container_name: config-cont
    ports:
      - "8888:8888"
    healthcheck:
      # Da li je config server podignut (odgovara na /health ili samo port)
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # 2. BAZA PODATAKA: MySQL
  db-mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_DATABASE: finansije_rezervacije_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend




  # 3. GATEWAY SERVIS
  gateway-service:
    build: ./gateway-service
    container_name: gateway-cont
    ports:
      - "8080:8080"
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - AUTH_SERVICE_URL=http://auth-service:8086
      - REZERVACIJE_SERVICE_URL=http://rezervacije-service:8082
      - FINANSIJE_SERVICE_URL=http://finansije-service:8083
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8084
      - MAINTENANCE_SERVICE_URL=http://maintenance-service:8085

    depends_on:
      config-service:
        condition: service_healthy
    networks:
      - frontend
      - backend

  # 4. AUTH SERVICE
  auth-service:
    build: ./auth-service
    container_name: auth-cont
#    ports:
#      - "8086:8086"

    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/finansije_rezervacije_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend

  # 5. FINANSIJE SERVICE
  finansije-service:
    build: ./finansije-service
    container_name: finansije-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - REZERVACIJE_SERVICE_URL=http://rezervacije-service:8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/finansije_rezervacije_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend

  # 6. REZERVACIJE SERVICE
  rezervacije-service:
    build: ./rezervacije-service
    container_name: rezervacije-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - FINANSIJE_SERVICE_URL=http://finansije-service:8083
      - SMESTAJ_SERVICE_URL=http://smestaj-service:8087
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/finansije_rezervacije_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRINGDOC_SERVER_URL=http://localhost:8080
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend

  # 7. ADMINER
  adminer:
    image: adminer
    container_name: adminer-cont
    ports:
      - "8087:8080"
    networks:
      - frontend
      - backend
  # 8. ACCOMMODATION SERVICE
  accommodation-service:
    build: ./accommodation-service
    container_name: accommodation-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/finansije_rezervacije_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend

  # 9. MAINTENANCE SERVICE
  maintenance-service:
    build: ./maintenance-service
    container_name: maintenance-cont
    environment:
      - CONFIG_SERVER_URL=http://config-service:8888
      - SPRING_DATASOURCE_URL=jdbc:mysql://db-mysql:3306/finansije_rezervacije_db?createDatabaseIfNotExist=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ACCOMMODATION_SERVICE_URL=http://accommodation-service:8084
    depends_on:
      db-mysql:
        condition: service_healthy
      config-service:
        condition: service_healthy
    networks:
      - backend
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data:
