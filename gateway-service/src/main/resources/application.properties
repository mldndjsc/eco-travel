spring.application.name=gateway-service
server.port=8080

springdoc.swagger-ui.path=/swagger-ui.html

spring.cloud.gateway.routes[0].id=odrzavanje-servis
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/odrzavanje/*/**

spring.cloud.gateway.routes[1].id=rezervacije-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/rezervacije/*/**
# Dodajemo ovaj filter da osiguramo da Gateway ne menja putanju prilikom prosle?ivanja


spring.cloud.gateway.routes[2].id=finansije-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/finansije/**

spring.cloud.gateway.routes[3].id=avanture-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/avanture/*/**

spring.cloud.gateway.routes[4].id=vodici-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/vodici/*/**

spring.cloud.gateway.routes[5].id=auth-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[6].id=smestaj-servis
spring.cloud.gateway.routes[6].uri=http://localhost:8087
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/smestaj/*/**



# Ostalo ostaje isto
springdoc.swagger-ui.urls[0].name=Odrzavanje Service
springdoc.swagger-ui.urls[0].url=/api/odrzavanje/v3/api-docs

springdoc.swagger-ui.urls[1].name=Rezervacije Service
springdoc.swagger-ui.urls[1].url=/api/rezervacije/v3/api-docs

springdoc.swagger-ui.urls[2].name=Finansije Service
springdoc.swagger-ui.urls[2].url=/api/finansije/v3/api-docs

springdoc.swagger-ui.urls[3].name=Avanture Service
springdoc.swagger-ui.urls[3].url=/api/avanture/v3/api-docs

springdoc.swagger-ui.urls[4].name=Vodici Service
springdoc.swagger-ui.urls[4].url=/api/vodici/v3/api-docs

springdoc.swagger-ui.urls[5].name=Auth Service
springdoc.swagger-ui.urls[5].url=/api/auth/v3/api-docs

springdoc.swagger-ui.urls[6].name=Smestaj Service
springdoc.swagger-ui.urls[6].url=/api/smestaj/v3/api-docs


spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:8080, http://localhost:8081, http://localhost:8082,http://localhost:8083, http://localhost:8084, http://localhost:8085, http://localhost:8086, http://localhost:8087,  http://localhost:8888
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

#v6

# Omogu?ava tracing
management.tracing.enabled=true
management.tracing.sampling.probability=1.0

# za Webflux
management.observations.http.server.requests.enabled=true
logging.pattern.level=%5p [traceId:%X{traceId}] [user:%X{authenticatedUser}] [role:%X{userRole}]