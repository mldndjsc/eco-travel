spring.application.name=vodici-service
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

server.port=${SERVER_PORT:8089}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api/vodici/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.server.url=http://localhost:8080

logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] [user:%X{authenticatedUser:-}] [role:%X{userRole:-}]

management.endpoints.web.exposure.include=health,info,metrics,refresh
management.endpoint.health.show-details=always
